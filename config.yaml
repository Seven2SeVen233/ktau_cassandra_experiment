# ============================================================
# Unified configuration for the Kendall-Tau Log Reconciliation
# experiments (single source of truth).
# After editing the docker section, run: python scripts/prepare_env.py
# to sync the parameters into .env (read automatically by docker compose).
# ============================================================

# ---- Docker / Cassandra cluster deployment ----
docker:
  image: cassandra:4.1              # image name:tag
  cluster_name: ktau                # cluster name (also the compose project name)
  dc: dc1                           # Cassandra data center
  rack: rack1                       # Cassandra rack
  network: ktau-net                 # compose network name (defined in docker-compose.yml; do not change)
  container_prefix: ktau-cass       # container name prefix, node i -> {prefix}-{i}
  client_port: 9042                 # host-mapped port -> container 9042
  heap_size: 1G                     # JVM MAX_HEAP_SIZE (per node)
  heap_newsize: 256M                # JVM HEAP_NEWSIZE (per node)
  cpu_limit: "2.0"                  # per-node CPU limit (cpus)
  mem_limit: 3G                     # per-node memory limit

# ---- Cassandra cluster size and connection ----
cluster:
  contact_points: ["127.0.0.1"]     # client connection address (cass-1 mapped port)
  port: 9042
  keyspace: ktau                    # experiment keyspace
  rf: 2                             # replication_factor
  n_nodes: 4                        # number of cluster nodes (docker-compose topology is designed around this)

data:
  dataset: BGL
  raw_file: data/BGL_2k.log
  max_ops: 2000
  seed: 42

model:
  N: 8                # number of logical replicas
  M: 24               # divergent operations per trial
  trials: 30          # trials per configuration
  seed: 42            # random seed
  obs: 0.9            # replica observation ratio
  noise: 0.05         # adjacent-swap noise probability for concurrent pairs
  skew_us: 500        # per-replica clock-skew bound (microseconds)

monitor:
  interval_s: 1.0
  threshold: 0.05
  window_ops: 20        # monitoring window (most recent operations)
  write_rate: 100       # monitor-stream write rate ops/s
  steady_ops: 120       # steady-state operations
  drift_ops: 120        # ordering-drift steps (reshuffle windows, no new ops)
  converge_ops: 40      # convergence steps (flush window divergence)
  partition_ops: 120    # set-divergence steps (groups A/B receive separately)
  heal_ops: 60          # healing steps

results_dir: results
