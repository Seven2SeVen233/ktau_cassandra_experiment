# Cassandra 4.1 cluster topology (4 nodes; serial health dependencies guarantee
# startup order).
# All tunable parameters come from the .env file at the project root (generated
# by scripts/prepare_env.py from config.yaml); they fall back to the defaults
# below when unset. To change parameters, edit config.yaml and run prepare_env.py.
name: ${CASSANDRA_CLUSTER_NAME:-ktau}

services:
  cass-1:
    image: ${CASSANDRA_IMAGE:-cassandra:4.1}
    container_name: ${CASSANDRA_CONTAINER_PREFIX:-ktau-cass}-1
    hostname: cass-1
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME:-ktau}
      CASSANDRA_SEEDS: cass-1
      MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP:-1G}
      HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEWSIZE:-256M}
      CASSANDRA_DC: ${CASSANDRA_DC:-dc1}
      CASSANDRA_RACK: ${CASSANDRA_RACK:-rack1}
    ports:
      - "${CASSANDRA_CLIENT_PORT:-9042}:9042"
    networks:
      - ktau-net
    deploy:
      resources:
        limits:
          cpus: "${CASSANDRA_CPU_LIMIT:-2.0}"
          memory: ${CASSANDRA_MEM_LIMIT:-3G}
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'select release_version from system.local' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 60s

  cass-2:
    image: ${CASSANDRA_IMAGE:-cassandra:4.1}
    container_name: ${CASSANDRA_CONTAINER_PREFIX:-ktau-cass}-2
    hostname: cass-2
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME:-ktau}
      CASSANDRA_SEEDS: cass-1
      MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP:-1G}
      HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEWSIZE:-256M}
      CASSANDRA_DC: ${CASSANDRA_DC:-dc1}
      CASSANDRA_RACK: ${CASSANDRA_RACK:-rack1}
    depends_on:
      cass-1:
        condition: service_healthy
    networks:
      - ktau-net
    deploy:
      resources:
        limits:
          cpus: "${CASSANDRA_CPU_LIMIT:-2.0}"
          memory: ${CASSANDRA_MEM_LIMIT:-3G}
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'select release_version from system.local' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 90s

  cass-3:
    image: ${CASSANDRA_IMAGE:-cassandra:4.1}
    container_name: ${CASSANDRA_CONTAINER_PREFIX:-ktau-cass}-3
    hostname: cass-3
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME:-ktau}
      CASSANDRA_SEEDS: cass-1
      MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP:-1G}
      HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEWSIZE:-256M}
      CASSANDRA_DC: ${CASSANDRA_DC:-dc1}
      CASSANDRA_RACK: ${CASSANDRA_RACK:-rack1}
    depends_on:
      cass-2:
        condition: service_healthy
    networks:
      - ktau-net
    deploy:
      resources:
        limits:
          cpus: "${CASSANDRA_CPU_LIMIT:-2.0}"
          memory: ${CASSANDRA_MEM_LIMIT:-3G}
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'select release_version from system.local' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 90s

  cass-4:
    image: ${CASSANDRA_IMAGE:-cassandra:4.1}
    container_name: ${CASSANDRA_CONTAINER_PREFIX:-ktau-cass}-4
    hostname: cass-4
    environment:
      CASSANDRA_CLUSTER_NAME: ${CASSANDRA_CLUSTER_NAME:-ktau}
      CASSANDRA_SEEDS: cass-1
      MAX_HEAP_SIZE: ${CASSANDRA_MAX_HEAP:-1G}
      HEAP_NEWSIZE: ${CASSANDRA_HEAP_NEWSIZE:-256M}
      CASSANDRA_DC: ${CASSANDRA_DC:-dc1}
      CASSANDRA_RACK: ${CASSANDRA_RACK:-rack1}
    depends_on:
      cass-3:
        condition: service_healthy
    networks:
      - ktau-net
    deploy:
      resources:
        limits:
          cpus: "${CASSANDRA_CPU_LIMIT:-2.0}"
          memory: ${CASSANDRA_MEM_LIMIT:-3G}
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'select release_version from system.local' >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 90s

networks:
  ktau-net:
    driver: bridge
